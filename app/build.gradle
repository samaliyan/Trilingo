plugins {
    id 'com.android.application'
}

// Release builds are signed with signing/trilingo.p12 when the SIGNING_PASSWORD secret is available
// (GitHub Actions). Without it (local builds, UI tests) the debug key is used.
def signingPassword = System.getenv('SIGNING_PASSWORD')

android {
    namespace 'io.github.samaliyan.trilingo'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.samaliyan.trilingo'
        minSdk 26
        targetSdk 34
        // Every GitHub build gets a higher number, so the in-app updater and Android accept it as newer.
        versionCode((System.getenv('BUILD_NUMBER') ?: '1') as int)
        versionName '1.2'
    }

    signingConfigs {
        release {
            if (signingPassword) {
                storeFile rootProject.file('signing/trilingo.p12')
                storeType 'pkcs12'
                storePassword signingPassword
                keyAlias 'trilingo'
                keyPassword signingPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingPassword ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        // Version-freshness checks are not code problems.
        disable 'GradleDependency', 'OldTargetApi', 'AndroidGradlePluginVersion'
    }
}
// No libraries on purpose: the app stays small and starts fast.
