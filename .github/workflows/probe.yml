name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: |
          mkdir -p out
          sh tools/coverage/raw.sh > out/coverage.tsv 2>&1 || true
      - if: always()
        run: |
          cd out && git init -q && git config user.name ci && git config user.email ci@x
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-out2
